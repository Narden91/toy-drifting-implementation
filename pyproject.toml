[project]
name = "toy-drifting-implementation"
version = "0.1.0"
description = "PyTorch implementation of generative modeling via drifting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "pyqtgraph>=0.13.0",
    "PyQt6>=6.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
