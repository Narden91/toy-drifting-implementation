# Performance Configuration Example
# This configuration showcases all available performance optimizations

training:
  batch_size: 2048
  lr: 0.001
  n_iter: 1000
  sample_every: 1000
  n_samples: 4096
  
  visualization:
    enabled: false

model:
  noise_dim: 32
  hidden_dim: 256
  out_dim: 2
  temp: 0.05

data:
  dataset: "8gaussians"  # or "checkerboard"

# Performance optimizations (all enabled)
performance:
  # Device selection (auto-detected if not specified)
  device: "cuda"  # Options: "auto", "cuda", "cpu", "mps"
  
  # Use torch.compile for JIT optimization (PyTorch 2.x only)
  # Provides 30-50% speedup on compatible hardware
  compile_model: true  # Set to true if using PyTorch 2.0+
  
  # Mixed precision training (AMP)
  # Reduces memory usage and increases speed on modern GPUs
  mixed_precision: true  # Enable for NVIDIA GPUs with Tensor Cores
  
  # Gradient checkpointing (for memory-limited scenarios)
  # Trades computation for memory - useful for very large models
  gradient_checkpointing: false
  
  # Data loading optimizations
  pin_memory: true  # Faster GPU transfer
  non_blocking: true  # Async data transfer
